site_name: Tutorial · By Taufik
site_description: Tutorial howto step by step, untuk beginner.
site_url: https://tutorial.taufik.fyi/

theme:
  name: material
  language: ms
  palette:
    scheme: default
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Utama: index.md
  - "Edit Video":
      - Pengenalan: edit-video/index.md
      - "1. Buat akaun GitHub": edit-video/01-github.md
      - "2. Langgan Claude": edit-video/02-claude.md
      - "3. Buat repo": edit-video/03-repo.md
      - "4. Muat naik video": edit-video/04-video.md
      - "5. Sambung Claude ke GitHub": edit-video/05-sambung.md
      - "6. Edit video pertama": edit-video/06-edit.md
      - "7. Ambil video siap": edit-video/07-ambil.md
      - "Masalah biasa": edit-video/08-masalah.md
