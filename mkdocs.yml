site_name: Tutorial · By Taufik
site_description: Tutorial howto step by step, untuk beginner.
site_url: https://tutorial.taufik.fyi/

theme:
  name: material
  language: ms
  palette:
    scheme: default
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - navigation.sections
    - toc.follow
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Utama: index.md
  - "Edit Video": edit-video/index.md
